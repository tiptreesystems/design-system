[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiptree-ui"
version = "0.5.0"
description = "Tiptree shared tokens and light/dark theme policies for Python consumers."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"

[project.optional-dependencies]
flask = ["flask>=3"]

[tool.setuptools]
packages = ["tiptree_ui"]

[tool.setuptools.package-data]
tiptree_ui = ["assets/*.css", "assets/**/*.css", "assets/*.json"]
