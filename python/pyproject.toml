[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiptree-ui"
version = "0.3.0"
description = "Tiptree design system for Python consumers - generated tokens, tt.css as package data, Flask blueprint, component bindings."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"

[project.optional-dependencies]
flask = ["flask>=3"]

[tool.setuptools]
packages = ["tiptree_ui"]

[tool.setuptools.package-data]
tiptree_ui = ["assets/*.css", "assets/**/*.css", "assets/*.json"]
