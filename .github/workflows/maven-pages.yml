name: Android Maven site

on:
  workflow_call:
  workflow_dispatch:

# Rebuild from all retained releases, then deploy as one site. Serialize recovery
# and release-triggered runs so an older snapshot cannot replace a newer one.
concurrency:
  group: android-maven-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/configure-pages@v5
      - name: Rebuild stable Maven repository from immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          required=()
          if [[ -n "$RELEASE_TAG" ]]; then required=(--require-tag "$RELEASE_TAG"); fi
          python scripts/build_maven_site.py --repository "$REPOSITORY" \
            --output _site "${required[@]}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Maven site
        id: deployment
        uses: actions/deploy-pages@v4
