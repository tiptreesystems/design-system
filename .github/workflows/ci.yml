name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run ci
      - name: Test Maven site assembly
        run: python -m unittest discover -s scripts/tests -v

  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift Package for iOS
        run: >-
          xcodebuild build
          -scheme TiptreeDesignSystem
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  android-candidate:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "16111833"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and verify unpublished Android candidate
        run: >-
          android/gradlew -p android :design-system:assembleDebug :design-system:assembleRelease
          :design-system:testDebugUnitTest :design-system:lintDebug
          :design-system:assembleDebugAndroidTest :design-system:candidateArchive
      - run: python3 scripts/check_android_artifact.py android/build/candidate/*-maven.zip
      - run: cd android/build/candidate && sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-android-candidate-${{ github.sha }}
          path: |
            android/build/candidate/
            android/design-system/build/reports/
          if-no-files-found: error
          retention-days: 14

  candidate-artifacts:
    needs: [checks, swift-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build generated package files
        run: npm run build
      - name: Build unpublished npm and wheel candidates
        run: |
          mkdir -p candidate/npm candidate/python
          npm pack --pack-destination candidate/npm
          python -m pip wheel python/ --no-deps --wheel-dir candidate/python
      - name: Check artifact contents
        run: python scripts/check_artifacts.py candidate/npm/*.tgz candidate/python/*.whl
      - name: Create SHA-256 checksums
        working-directory: candidate
        run: sha256sum npm/*.tgz python/*.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-candidates-${{ github.sha }}
          path: |
            candidate/npm/*.tgz
            candidate/python/*.whl
            candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
