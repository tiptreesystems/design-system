name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run release gates
        run: npm run ci
      - name: Build retained npm and wheel artifacts
        run: |
          mkdir -p release/npm release/python
          npm pack --pack-destination release/npm
          python -m pip wheel python/ --no-deps --wheel-dir release/python
      - name: Create SHA-256 checksums
        working-directory: release
        run: sha256sum npm/*.tgz python/*.whl > SHA256SUMS
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/npm/*.tgz
            release/python/*.whl
            release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-release-${{ github.ref_name }}
          path: |
            release/npm/*.tgz
            release/python/*.whl
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/npm/*.tgz \
            release/python/*.whl \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
