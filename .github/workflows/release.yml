name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          py_version="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${py_version}" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject version $py_version"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run release gates
        run: npm run ci
      - name: Build retained npm and wheel artifacts
        run: |
          mkdir -p release/npm release/python
          npm pack --pack-destination release/npm
          python -m pip wheel python/ --no-deps --wheel-dir release/python
      - name: Create SHA-256 checksums
        working-directory: release
        run: |
          shopt -s nullglob
          tgz=(npm/*.tgz) whl=(python/*.whl)
          if [[ ${#tgz[@]} -ne 1 || ${#whl[@]} -ne 1 ]]; then
            echo "::error::expected exactly 1 tarball and 1 wheel; found ${#tgz[@]} .tgz, ${#whl[@]} .whl"
            exit 1
          fi
          (cd npm && sha256sum -- *.tgz) > SHA256SUMS
          (cd python && sha256sum -- *.whl) >> SHA256SUMS
          cat SHA256SUMS
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/npm/*.tgz
            release/python/*.whl
            release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-release-${{ github.ref_name }}
          path: |
            release/npm/*.tgz
            release/python/*.whl
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/npm/*.tgz \
            release/python/*.whl \
            release/SHA256SUMS \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "$GITHUB_REF_NAME"
